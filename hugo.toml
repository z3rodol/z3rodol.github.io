# ==================================================
# CONFIGURATION PRINCIPALE DU SITE HUGO
# ==================================================

# URL de base du site (à modifier pour la production)
baseURL = "https://z3rodol.github.io"

# Thème utilisé (LoveIt est un thème moderne pour Hugo)
theme = "LoveIt"

# Titre principal du site (affiché dans l'onglet du navigateur)
title = "z3rodol"

# ==================================================
# CONFIGURATION LINGUISTIQUE
# ==================================================

# Code de la langue principale ["en", "zh-CN", "fr", "pl", ...]
languageCode = "en"
# Nom affiché de la langue ["English", "Français", ...]
languageName = "English"
# Active les fonctionnalités spécifiques aux langues CJK (Chinois/Japonais/Coréen)
hasCJKLanguage = false

# ==================================================
# CONFIGURATION GÉNÉRALE
# ==================================================

# Copyright (utilisé pour le SEO)
copyright = ""

# Génère automatiquement un robots.txt
enableRobotsTXT = true
# Active la récupération des infos Git (date, auteur) pour les pages
enableGitInfo = true
# Active le support des émojis (ex: :smile:)
enableEmoji = true

# Ignore certaines erreurs de build (utile pour les contenus externes)
ignoreErrors = ["error-remote-getjson", "error-missing-instagram-accesstoken"]

# ==================================================
# CONFIGURATION DE LA PAGINATION
# ==================================================

[pagination]
  disableAliases = false    # Désactive les alias pour les pages de pagination
  pagerSize = 30            # Nombre d'éléments par page
  path = "page"             # Chemin URL pour la pagination (ex: /page/2/)

# ==================================================
# CONFIGURATION DU MENU PRINCIPAL
# ==================================================

[menu]
  [[menu.main]]
    weight = 1
    identifier = "posts"
    pre = ""                # Élément HTML avant le nom (icône, etc.)
    post = ""               # Élément HTML après le nom
    name = "Posts"          # Texte affiché dans le menu
    url = "/posts/"         # Lien URL
    title = ""              # Texte au survol (tooltip)

  [[menu.main]]
    weight = 2
    identifier = "tags"
    pre = ""
    post = ""
    name = "Tags"
    url = "/tags/"
    title = ""

  [[menu.main]]
    weight = 3
    identifier = "categories"
    pre = ""
    post = ""
    name = "Categories"
    url = "/categories/"
    title = ""

  [[menu.main]]
    weight = 4
    identifier = "about"
    pre = ""
    post = ""
    name = "About"
    url = "/about/"
    title = ""



# ==================================================
# PARAMÈTRES PRINCIPAUX DU THÈME
# ==================================================

[params]
  # Thème par défaut du site ["auto", "light", "dark"]
  defaultTheme = "auto"
  
  # URL du dépôt Git public (nécessite enableGitInfo = true)
  gitRepo = ""
  
  # Algorithme de hash pour SRI (Subresource Integrity)
  # ["sha256", "sha384", "sha512", "md5"] - vide = désactivé
  fingerprint = ""
  
  # Format d'affichage des dates
  dateFormat = "2006-01-02"
  
  # Titre pour les métadonnées Open Graph et Twitter Cards
  title = "My cool site"
  
  # Description pour RSS, SEO, Open Graph et Twitter Cards
  description = "This is my cool site"
  
  # Images pour Open Graph et Twitter Cards
  images = ["/logo.png"]

# ==================================================
# CONFIGURATION DE L'AUTEUR
# ==================================================

  [params.author]
    name = "z3rodol"
    email = ""
    link = "https://z3rodol.github.io"

# ==================================================
# CONFIGURATION DE L'EN-TÊTE (HEADER)
# ==================================================

  [params.header]
    desktopMode = "fixed"     # Mode sur desktop ["fixed", "normal", "auto"]
    mobileMode = "auto"       # Mode sur mobile ["fixed", "normal", "auto"]
    
    [params.header.title]
      logo = ""               # URL du logo
      name = "z3rodol Blog"               # Titre textuel
      pre = ""                # Élément HTML avant le titre
      post = ""               # Élément HTML après le titre
      typeit = false          # Animation de frappe pour le titre

# ==================================================
# CONFIGURATION DU PIED DE PAGE (FOOTER)
# ==================================================

  [params.footer]
    enable = true
    custom = ''               # Contenu personnalisé (HTML supporté)
    hugo = true               # Affiche les infos Hugo et thème
    copyright = true          # Affiche le copyright
    author = true             # Affiche l'auteur
    since = 2025              # Année de création du site
    icp = ""                  # Licence ICP (Chine uniquement)
    license = '<a rel="license external nofollow noopener noreffer" href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank">CC BY-NC 4.0</a>'

# ==================================================
# CONFIGURATION DES PAGES DE SECTION
# ==================================================

  [params.section]
    paginate = 30             # Nombre d'articles par page
    dateFormat = "01-02"      # Format des dates (mois-jour)
    rss = 10                  # Nombre d'articles dans le flux RSS

# ==================================================
# CONFIGURATION DES PAGES DE LISTE (CATÉGORIES/TAGS)
# ==================================================

  [params.list]
    paginate = 30
    dateFormat = "01-02"
    rss = 10

# ==================================================
# CONFIGURATION DE L'ICÔNE D'APPLICATION
# ==================================================

  [params.app]
    title = "z3rodol"    # Titre sur mobile (écran d'accueil)
    noFavicon = false         # Désactive la favicon
    svgFavicon = ""           # Favicon au format SVG
    themeColor = "#ffffff"    # Couleur du thème Android
    iconColor = "#5bbad5"     # Couleur de l'icône Safari
    tileColor = "#da532c"     # Couleur des tuiles Windows

# ==================================================
# CONFIGURATION DE LA RECHERCHE
# ==================================================

  [params.search]
    enable = true
    type = "lunr"             # Moteur de recherche ["lunr", "algolia"]
    contentLength = 4000      # Longueur max du contenu indexé
    placeholder = ""          # Texte indicatif dans la barre
    maxResultLength = 15      # Nombre max de résultats
    snippetLength = 30        # Longueur des extraits
    highlightTag = "em"       # Tag HTML pour surligner les résultats
    absoluteURL = false       # Utilise des URLs absolues dans l'index
    
    [params.search.algolia]   # Configuration Algolia (si type = "algolia")
      index = ""
      appID = ""
      searchKey = ""

# ==================================================
# CONFIGURATION DE LA PAGE D'ACCUEIL
# ==================================================

  [params.home]
    rss = 10                  # Nombre d'articles dans le flux RSS
    
    # Section profil sur la page d'accueil
    [params.home.profile]
      enable = true
      gravatarEmail = ""      # Email Gravatar pour l'avatar
      avatarURL = "images/avatar.jpg"  # URL de l'avatar
      title = "z3rodol"              # Titre (HTML supporté)
      subtitle = "Bienvenu sur mon blog"  # Sous-titre
      typeit = true           # Animation de frappe pour le sous-titre
      social = true           # Affiche les liens sociaux
      disclaimer = ""         # Avis de non-responsabilité (HTML supporté)
    
    # Section articles sur la page d'accueil
    [params.home.posts]
      enable = true
      paginate = 6            # Nombre d'articles par page
      defaultHiddenFromHomePage = false  # Cache par défaut des articles

# ==================================================
# CONFIGURATION DES RÉSEAUX SOCIAUX
# ==================================================

  [params.social]
    GitHub = "z3rodol"
    X = "z3rodol"                # Twitter/X
    RSS = true                # Affiche le flux RSS
    Linkedin = "z3rodol"
    # Medium = ""
    # Gitlab = ""
    # ... (autres réseaux disponibles)

# ==================================================
# CONFIGURATION GLOBALE DES PAGES
# ==================================================

  [params.page]
    hiddenFromHomePage = false    # Cache la page de l'accueil
    hiddenFromSearch = false      # Cache la page des résultats de recherche
    twemoji = false               # Active Twemoji (émojis Twitter)
    lightgallery = true          # Active la galerie d'images
    ruby = true                   # Active la syntaxe Ruby
    fraction = true               # Active la syntaxe des fractions
    fontawesome = true            # Active Font Awesome
    linkToMarkdown = true         # Lien vers le fichier Markdown source
    rssFullText = false           # Texte complet dans le flux RSS
    
    # Table des matières (TOC)
    [params.page.toc]
      enable = true
      keepStatic = false          # Garde la TOC statique en début d'article
      auto = false                 # TOC automatiquement repliée
    
    # Formules mathématiques KaTeX
    [params.page.math]
      enable = true
      inlineLeftDelimiter = ""    # Délimiteur gauche pour les maths inline
      inlineRightDelimiter = ""   # Délimiteur droit pour les maths inline
      blockLeftDelimiter = ""     # Délimiteur gauche pour les blocs
      blockRightDelimiter = ""    # Délimiteur droit pour les blocs
      copyTex = true              # Extension "copier le code LaTeX"
      mhchem = true               # Extension pour la chimie
    
    # Configuration des blocs de code
    [params.page.code]
      copy = true                 # Bouton pour copier le code
      maxShownLines = 10          # Nombre max de lignes affichées
    
    # Cartes Mapbox GL
    [params.page.mapbox]
      accessToken = ""            # Token d'accès Mapbox
      lightStyle = "mapbox://styles/mapbox/light-v10?optimize=true"
      darkStyle = "mapbox://styles/mapbox/dark-v10?optimize=true"
      navigation = true           # Ajoute les contrôles de navigation
      geolocate = true            # Ajoute le bouton de géolocalisation
      scale = true                # Ajoute l'échelle
      fullscreen = true           # Ajoute le mode plein écran
    
    # Boutons de partage social
    [params.page.share]
      enable = true
      X = true
      Threads = false
      Facebook = false
      HackerNews = false
      Line = false
      Weibo = false
      Diaspora = false
      Telegram = false
      # Twitter = false
      # Linkedin = false
      # ... (autres réseaux sociaux)
    
    # Configuration des commentaires
    [params.page.comment]
      enable = false  # Désactivé par défaut
      
      # Disqus
      [params.page.comment.disqus]
        enable = false
        shortname = ""
      
      # Gitalk (commentaires basés sur GitHub Issues)
      [params.page.comment.gitalk]
        enable = false
        owner = ""
        repo = ""
        clientId = ""
        clientSecret = ""
      
      # Valine (commentaires basés sur LeanCloud)
      [params.page.comment.valine]
        enable = false
        appId = ""
        appKey = ""
        placeholder = ""
        avatar = "mp"
        meta = ""
        pageSize = 10
        lang = ""
        visitor = true
        recordIP = true
        highlight = true
        enableQQ = false
        serverURLs = ""
        emoji = ""  # Fichier d'émojis ["apple.yml", "google.yml", ...]
      
      # Facebook Comments
      [params.page.comment.facebook]
        enable = false
        width = "100%"
        numPosts = 10
        appId = ""
        languageCode = ""
      
      # Telegram Comments
      [params.page.comment.telegram]
        enable = false
        siteID = ""
        limit = 5
        height = ""
        color = ""
        colorful = true
        dislikes = false
        outlined = false
      
      # Commento
      [params.page.comment.commento]
        enable = false
      
      # Utterances (commentaires GitHub)
      [params.page.comment.utterances]
        enable = false
        repo = ""           # "proprietaire/repo"
        issueTerm = "pathname"
        label = ""
        lightTheme = "github-light"
        darkTheme = "github-dark"
      
      # Giscus (commentaires GitHub Discussions)
      [params.page.comment.giscus]
        enable = false
        repo = ""
        repoId = ""
        category = "Announcements"
        categoryId = ""
        lang = ""
        mapping = "pathname"
        reactionsEnabled = "1"
        emitMetadata = "0"
        inputPosition = "bottom"
        lazyLoading = false
        lightTheme = "light"
        darkTheme = "dark"
    
    # Bibliothèques tierces (CSS/JS)
    [params.page.library]
      [params.page.library.css]
        # Exemple: customCSS = "css/custom.css"
      [params.page.library.js]
        # Exemple: customJS = "js/custom.js"
    
    # Configuration SEO par page
    [params.page.seo]
      images = []  # URLs des images
      [params.page.seo.publisher]
        name = ""
        logoUrl = ""

# ==================================================
# CONFIGURATION TYPEIT (ANIMATION DE FRAPPE)
# ==================================================

  [params.typeit]
    speed = 100                 # Vitesse de frappe (ms)
    cursorSpeed = 1000          # Vitesse de clignotement du curseur (ms)
    cursorChar = "|"            # Caractère du curseur
    duration = -1               # Durée après la frappe (-1 = illimité)

# ==================================================
# CODES DE VÉRIFICATION (SEO)
# ==================================================

  [params.verification]
    google = ""
    bing = ""
    yandex = ""
    pinterest = ""
    baidu = ""

# ==================================================
# CONFIGURATION SEO GLOBALE
# ==================================================

  [params.seo]
    image = ""                  # Image principale
    thumbnailUrl = ""           # URL de la miniature

# ==================================================
# CONFIGURATION DES ANALYTIQUES
# ==================================================

  [params.analytics]
    enable = true
    
    # Google Analytics
    [params.analytics.google]
      id = ""
      anonymizeIP = true        # Anonymise les adresses IP
      respectDoNotTrack = false # Respecte "Do Not Track"
    
    # Fathom Analytics
    [params.analytics.fathom]
      id = ""
      server = ""               # URL du serveur auto-hébergé
    
    # Plausible Analytics
    [params.analytics.plausible]
      dataDomain = ""
    
    # Yandex Metrica
    [params.analytics.yandexMetrica]
      id = ""

# ==================================================
# BANNIÈRE DE CONSENTEMENT DES COOKIES
# ==================================================

  [params.cookieconsent]
    enable = false
    [params.cookieconsent.content]
      message = ""              # Message de la bannière
      dismiss = ""              # Texte du bouton "Accepter"
      link = ""                 # Lien vers la politique de confidentialité

# ==================================================
# CONFIGURATION CDN
# ==================================================

  [params.cdn]
    # Fichier de configuration CDN (ex: "jsdelivr.yml")
    data = ""

# ==================================================
# CONFIGURATION DE COMPATIBILITÉ
# ==================================================

  [params.compatibility]
    polyfill = false            # Utilise Polyfill.io pour vieux navigateurs
    objectFit = false           # Support object-fit pour vieux navigateurs

# ==================================================
# CONFIGURATION DU MARKDOWN
# ==================================================

[markup]
  # Coloration syntaxique
  [markup.highlight]
    codeFences = true           # Active la coloration dans les blocs de code
    guessSyntax = true          # Devine la syntaxe si non spécifiée
    lineNos = true              # Affiche les numéros de ligne
    lineNumbersInTable = true   # Numéros dans un tableau
    noClasses = false           # Utilise des classes CSS (ne pas modifier)
  
  # Goldmark (moteur Markdown)
  [markup.goldmark]
    [markup.goldmark.extensions]
      definitionList = true     # Listes de définitions
      footnote = true           # Notes de bas de page
      linkify = true            # Transforme les URLs en liens
      strikethrough = true      # Texte barré ~~texte~~
      table = true              # Tableaux
      taskList = true           # Listes de tâches - [x]
      typographer = true        # Améliorations typographiques
    
    [markup.goldmark.renderer]
      unsafe = true             # Autorise le HTML brut dans le Markdown
  
  # Configuration de la table des matières
  [markup.tableOfContents]
    startLevel = 1              # Niveau de titre minimum (h1)
    endLevel = 6                # Niveau de titre maximum (h6)

# ==================================================
# CONFIGURATION DU SITEMAP
# ==================================================

[sitemap]
  changefreq = "weekly"         # Fréquence de changement
  filename = "sitemap.xml"      # Nom du fichier
  priority = 0.5                # Priorité par défaut (0-1)

# ==================================================
# CONFIGURATION DES PERMALIENS
# ==================================================

[Permalinks]
  # Format des URLs pour les articles
  # posts = ":year/:month/:filename"  # Ancien format
  posts = ":contentbasename"    # Nouveau format recommandé (remplace :filename)

# ==================================================
# CONFIGURATION DE LA VIE PRIVÉE
# ==================================================

[privacy]
  [privacy.googleAnalytics]
    # Configuration de confidentialité Google Analytics
  [privacy.twitter]
    # Configuration de confidentialité Twitter
  [privacy.youtube]
    # Configuration de confidentialité YouTube
    # ... (autres services)

# ==================================================
# CONFIGURATION DES FICHIERS DE SORTIE
# ==================================================

# Types de médias
[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["md"]           # Extension .md pour les fichiers texte

# Formats de sortie
[outputFormats.MarkDown]
  mediaType = "text/plain"
  isPlainText = true
  isHTML = false

# Formats de sortie par type de page
[outputs]
  home = ["HTML", "RSS", "JSON"]      # Page d'accueil
  page = ["HTML", "MarkDown"]         # Pages individuelles
  section = ["HTML", "RSS"]           # Sections
  taxonomy = ["HTML", "RSS"]          # Taxonomies (tags, catégories)